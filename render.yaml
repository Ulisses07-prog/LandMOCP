services:
  - type: web
    name: arruda-catalogo-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "if [ -d backend ]; then cd backend; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./arruda.db
      - key: WHATSAPP_NUMBER
        value: 5581999999999
